spring.datasource.url=${IRISA_DB_URL:jdbc:mysql://localhost:3306/irisa?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${IRISA_DB_USERNAME:irisa}
spring.datasource.password=${IRISA_DB_PASSWORD:irisa}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${IRISA_REDIS_HOST:localhost}
spring.data.redis.port=${IRISA_REDIS_PORT:6379}
spring.data.mongodb.uri=${IRISA_MONGODB_URI:mongodb://localhost:27017/irisa}
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

irisa.security.jwt-issuer=${IRISA_JWT_ISSUER:irisa-local}
irisa.security.jwt-secret=${IRISA_JWT_SECRET:change-me-in-development}
irisa.runtime.worker.core-pool-size=${IRISA_WORKER_CORE_POOL_SIZE:4}
irisa.runtime.worker.max-pool-size=${IRISA_WORKER_MAX_POOL_SIZE:16}
irisa.runtime.worker.queue-capacity=${IRISA_WORKER_QUEUE_CAPACITY:64}
