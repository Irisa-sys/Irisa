# Configuration required before the main Spring application context starts.
spring.application.name=${IRISA_APPLICATION_NAME:irisa-backend}

# Apollo Config Service.
app.id=${APOLLO_APP_ID:${spring.application.name}}
apollo.meta=${APOLLO_META:http://localhost:8080}
apollo.cacheDir=${APOLLO_CACHE_DIR:${java.io.tmpdir}/irisa-apollo-cache}
apollo.bootstrap.enabled=true
apollo.bootstrap.eagerLoad.enabled=true
apollo.bootstrap.namespaces=application,irisa

# Future service registration and discovery settings belong in this file.
