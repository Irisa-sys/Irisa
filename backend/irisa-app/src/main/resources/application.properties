spring.application.name=irisa
server.port=${IRISA_PORT:8080}

spring.datasource.url=${IRISA_MYSQL_URL}
spring.datasource.username=${IRISA_MYSQL_USERNAME}
spring.datasource.password=${IRISA_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=1

mybatis.configuration.map-underscore-to-camel-case=true

spring.data.redis.host=${IRISA_REDIS_HOST}
spring.data.redis.port=${IRISA_REDIS_PORT:6379}
spring.data.redis.password=${IRISA_REDIS_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

irisa.auth.jwt-secret=${IRISA_JWT_SECRET}
irisa.auth.jwt-ttl-seconds=${IRISA_JWT_TTL_SECONDS:604800}
irisa.auth.mock-enabled=${IRISA_AUTH_MOCK_ENABLED:true}
irisa.auth.github-enabled=${IRISA_AUTH_GITHUB_ENABLED:false}

irisa.llm.provider=${IRISA_LLM_PROVIDER:script}

irisa.rocketmq.endpoints=${IRISA_ROCKETMQ_ENDPOINTS:}
irisa.es.uris=${IRISA_ES_URIS:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
