<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="System Context">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
    .box { fill: #fff; stroke: #4f46e5; stroke-width: 1.5; }
    .core { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .line { stroke: #64748b; fill: none; stroke-width: 1.25; marker-end: url(#arr); }
    .lbl { font-size: 11px; fill: #475569; }
    .t { font-size: 14px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .box { fill: #1e293b; stroke: #a5b4fc; }
      .core { fill: #312e81; stroke: #a5b4fc; }
      .line { stroke: #94a3b8; }
      .lbl { fill: #cbd5e1; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="box" x="16" y="78" width="88" height="44" rx="6"/>
  <text class="t" x="60" y="105" text-anchor="middle">玩家</text>

  <rect class="core" x="220" y="70" width="140" height="60" rx="6"/>
  <text class="t" x="290" y="105" text-anchor="middle">Irisa 平台</text>

  <rect class="box" x="500" y="16" width="120" height="40" rx="6"/>
  <text class="t" x="560" y="41" text-anchor="middle">GitHub</text>
  <rect class="box" x="500" y="78" width="120" height="44" rx="6"/>
  <text class="t" x="560" y="105" text-anchor="middle">模型供应商</text>
  <rect class="box" x="500" y="148" width="120" height="40" rx="6"/>
  <text class="t" x="560" y="173" text-anchor="middle">Slack</text>

  <path class="line" d="M104 100 H220"/>
  <path class="line" d="M360 86 C430 86 430 36 500 36"/>
  <path class="line" d="M360 100 H500"/>
  <path class="line" d="M360 114 C430 114 430 168 500 168"/>

  <text class="lbl" x="162" y="92" text-anchor="middle">登录 / 游玩</text>
  <text class="lbl" x="430" y="28" text-anchor="middle">OAuth / webhook</text>
  <text class="lbl" x="430" y="92" text-anchor="middle">最小上下文</text>
  <text class="lbl" x="430" y="152" text-anchor="middle">破产红牌</text>
