<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="SSE 帧链路">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; font-size: 12px; }
    .t { font-size: 13px; font-weight: 600; }
    .box { fill: #fff; stroke: #4f46e5; stroke-width: 1.25; }
    .life { stroke: #94a3b8; stroke-width: 1; }
    .msg { stroke: #334155; fill: none; stroke-width: 1.2; marker-end: url(#a4); }
    .ret { stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .box { fill: #1e293b; stroke: #a5b4fc; }
      .life { stroke: #64748b; }
      .msg { stroke: #cbd5e1; }
    }
  </style>
  <defs>
