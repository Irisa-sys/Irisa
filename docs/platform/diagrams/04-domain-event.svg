<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280" role="img" aria-label="领域事件链路">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; font-size: 12px; }
    .t { font-size: 13px; font-weight: 600; }
    .box { fill: #fff; stroke: #4f46e5; stroke-width: 1.25; }
    .life { stroke: #94a3b8; stroke-width: 1; }
    .msg { stroke: #334155; fill: none; stroke-width: 1.2; marker-end: url(#a3); }
    .ret { stroke-dasharray: 4 3; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .box { fill: #1e293b; stroke: #a5b4fc; }
      .life { stroke: #64748b; }
      .msg { stroke: #cbd5e1; }
    }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="8" width="100" height="36" rx="4"/>
  <text class="t" x="58" y="31" text-anchor="middle">游戏插件</text>
  <rect class="box" x="148" y="8" width="120" height="36" rx="4"/>
  <text class="t" x="208" y="31" text-anchor="middle">MySQL</text>
  <rect class="box" x="308" y="8" width="100" height="36" rx="4"/>
  <text class="t" x="358" y="31" text-anchor="middle">补偿任务</text>
  <rect class="box" x="448" y="8" width="100" height="36" rx="4"/>
  <text class="t" x="498" y="31" text-anchor="middle">浏览器</text>
  <line class="life" x1="58" y1="44" x2="58" y2="268"/>
  <line class="life" x1="208" y1="44" x2="208" y2="268"/>
  <line class="life" x1="358" y1="44" x2="358" y2="268"/>
  <line class="life" x1="498" y1="44" x2="498" y2="268"/>

  <path class="msg" d="M58 80 H200"/>
  <text x="130" y="72" text-anchor="middle">私有表 + ledger + event_log</text>
  <path class="msg" d="M358 128 H216"/>
  <text x="286" y="120" text-anchor="middle">扫 PENDING 改分 DONE</text>
  <path class="msg ret" d="M498 176 H66"/>
  <text x="280" y="168" text-anchor="middle">GET /api/persona</text>
  <path class="msg ret" d="M58 224 H490"/>
  <text x="280" y="216" text-anchor="middle">新健康度</text>
</svg>
