<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="本域同步写再 emit；外域只调查询 API">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #0f172a; font-size: 11px; }
    .t { font-size: 12px; font-weight: 600; }
    .box { fill: #fff; stroke: #4f46e5; stroke-width: 1.25; }
    .life { stroke: #94a3b8; stroke-width: 1; }
    .msg { stroke: #334155; fill: none; stroke-width: 1.2; marker-end: url(#a3); }
    .note { fill: #f8fafc; stroke: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e2e8f0; }
      .box { fill: #1e293b; stroke: #a5b4fc; }
      .life { stroke: #64748b; }
      .msg { stroke: #cbd5e1; }
      .note { fill: #1e293b; stroke: #64748b; }
    }
  </style>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="box" x="8" y="8" width="88" height="32" rx="4"/>
  <text class="t" x="52" y="28" text-anchor="middle">命令</text>
  <rect class="box" x="120" y="8" width="72" height="32" rx="4"/>
  <text class="t" x="156" y="28" text-anchor="middle">MySQL</text>
  <rect class="box" x="216" y="8" width="80" height="32" rx="4"/>
  <text class="t" x="256" y="28" text-anchor="middle">本域 ES</text>
  <rect class="box" x="320" y="8" width="80" height="32" rx="4"/>
  <text class="t" x="360" y="28" text-anchor="middle">query API</text>
  <rect class="box" x="424" y="8" width="72" height="32" rx="4"/>
  <text class="t" x="460" y="28" text-anchor="middle">外域</text>
  <rect class="box" x="520" y="8" width="88" height="32" rx="4"/>
  <text class="t" x="564" y="28" text-anchor="middle">corpus 异步</text>
  <rect class="box" x="632" y="8" width="80" height="32" rx="4"/>
  <text class="t" x="672" y="28" text-anchor="middle">irisa_corpus</text>
  <line class="life" x1="52" y1="40" x2="52" y2="248"/>
  <line class="life" x1="156" y1="40" x2="156" y2="248"/>
  <line class="life" x1="256" y1="40" x2="256" y2="248"/>
  <line class="life" x1="360" y1="40" x2="360" y2="248"/>
  <line class="life" x1="460" y1="40" x2="460" y2="248"/>
  <line class="life" x1="564" y1="40" x2="564" y2="248"/>
  <line class="life" x1="672" y1="40" x2="672" y2="248"/>
  <path class="msg" d="M52 72 H148"/>
  <text x="100" y="64" text-anchor="middle">事务提交</text>
  <path class="msg" d="M52 112 H248"/>
  <text x="150" y="104" text-anchor="middle">同步写读模型</text>
  <path class="msg" d="M52 152 H452"/>
  <text x="252" y="144" text-anchor="middle">然后 emit</text>
  <path class="msg" d="M460 192 H368"/>
  <text x="414" y="184" text-anchor="middle">只调查询</text>
  <path class="msg" d="M564 232 H664"/>
  <text x="614" y="224" text-anchor="middle">embedding</text>
